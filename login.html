<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تسجيل الدخول | سراج – مدرسة أبو عبيدة</title>

  <link rel="icon" type="image/svg+xml" href="./src/assets/images/favicon.svg">
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/global.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">

  <script>
    (function () {
      const savedTheme = localStorage.getItem('siraj-theme');
      if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else if (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  
  <style>
    .auth-container {
      max-width: 450px;
      margin: 4rem auto;
      padding: 2.5rem 2rem;
      border-radius: var(--border-radius-lg);
      background-color: var(--color-bg-secondary);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
    }
    .auth-title {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--color-accent);
      font-size: 1.75rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .form-control {
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(11, 83, 69, 0.1);
    }
    .password-container {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      font-size: 1.1rem;
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.1rem;
      margin-top: 1rem;
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .auth-links {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    .auth-links a {
      color: var(--color-accent);
      font-weight: 600;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
    .social-login {
      margin-top: 2rem;
      text-align: center;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }
    .divider::before { margin-left: 0.5rem; }
    .divider::after { margin-right: 0.5rem; }
    
    .btn-google {
      width: 100%;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1rem;
      padding: 0.75rem;
    }
    .btn-google:hover {
      background-color: var(--color-bg-secondary);
      border-color: var(--color-text-muted);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="index.html" class="logo"><img src="./src/assets/images/logo.svg" alt="شعار سراج"></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">نبذة</a>
        <a href="develop.html" class="nav-link">طوّر نفسك</a>
        <a href="competition.html" class="nav-link">مسابقة السراج</a>
        <a href="research.html" class="nav-link">البحث العلمي</a>
        <a href="identity.html" class="nav-link">الهوية الوطنية</a>
        <a href="dashboard.html" class="nav-link auth-required hidden">لوحة التحكم</a>
      </nav>
      <div class="flex items-center gap-2">
        <button id="theme-toggle" class="btn-icon theme-toggle-btn" aria-label="تبديل الثيم"></button>
        <button id="hamburger-btn" class="hamburger">&#9776;</button>
      </div>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="mobile-menu-overlay">
    <div class="flex justify-between items-center" style="margin-bottom: 2rem;">
      <a href="index.html" class="logo"><img src="./src/assets/images/logo.svg" style="height:35px;"></a>
      <button onclick="document.getElementById('mobile-menu').classList.remove('active')" class="btn-icon" style="font-size: 2rem; margin-top: -10px;">&times;</button>
    </div>
    <a href="index.html" class="mobile-nav-link">نبذة</a>
    <a href="develop.html" class="mobile-nav-link">طوّر نفسك</a>
    <a href="competition.html" class="mobile-nav-link">مسابقة السراج</a>
    <a href="research.html" class="mobile-nav-link">البحث العلمي</a>
    <a href="identity.html" class="mobile-nav-link">الهوية الوطنية</a>
  </div>

  <!-- Login Form -->
  <main class="main-content container">
    <div class="auth-container">
      <h2 class="auth-title">تسجيل الدخول</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" class="form-control" placeholder="student@example.com" required dir="ltr" style="text-align: right;">
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="password-container">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required dir="ltr" style="text-align: right; width: 100%;">
            <button type="button" class="password-toggle" id="toggle-password" tabindex="-1">👁️</button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
          دخول
        </button>

        <div class="auth-links">
          <a href="forgot-password.html">نسيت كلمة المرور؟</a>
          <a href="signup.html">إنشاء حساب جديد</a>
        </div>

        <div class="divider">أو تسجيل الدخول عبر</div>
        
        <button type="button" class="btn btn-google" id="google-login-btn">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
      </form>
    </div>
  </main>

  <footer class="footer"><div class="container"><p>&copy; 2026 سراج – مدرسة أبو عبيدة. جميع الحقوق محفوظة.</p></div></footer>

  <script type="module">
    import { authService } from './src/services/auth.js';
    import './src/scripts/main.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Logic for pre-redirecting authenticated users away from Login
      if (authService.isLoggedIn()) {
        window.location.replace('dashboard.html');
      }
      document.addEventListener('auth-status-changed', (e) => {
        if (e.detail.isLoggedIn) window.location.replace('dashboard.html');
      });

      const togglePwdBtn = document.getElementById('toggle-password');
      const pwdInput = document.getElementById('password');
      
      togglePwdBtn.addEventListener('click', () => {
        const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwdInput.setAttribute('type', type);
        togglePwdBtn.textContent = type === 'password' ? '👁️' : '🙈';
      });

      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pwd = document.getElementById('password').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري التحقق...';

        try {
          await authService.login(email, pwd);
          window.Toast.success('تم تسجيل الدخول بنجاح! جاري التوجيه...');
          setTimeout(() => { window.location.replace('dashboard.html'); }, 1000);
        } catch (error) {
          let msg = 'حدث خطأ أثناء الاتصال بالخادم.';
          if (error.message.includes('Invalid login')) msg = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
          else if (error.message.includes('Email not confirmed')) msg = 'يرجى تأكيد بريدك الإلكتروني أولاً.';
          
          window.Toast.error(msg);
          submitBtn.disabled = false;
          submitBtn.textContent = 'دخول';
        }
      });

      // Google OAuth Logic
      const googleBtn = document.getElementById('google-login-btn');
      googleBtn.addEventListener('click', async () => {
        googleBtn.disabled = true;
        googleBtn.innerHTML = 'جاري التوجيه إلى Google...';
        try {
          await authService.loginWithGoogle();
        } catch (err) {
          window.Toast.error('لم نتمكن من الاتصال بخدمة Google.');
          googleBtn.disabled = false;
          googleBtn.innerHTML = 'Google';
        }
      });
    });
  </script>
</body>
</html>
